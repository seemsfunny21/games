<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071426"><meta name="color-scheme" content="dark"><title>ChessFunny — Σκάκι</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="manifest" href="./manifest.webmanifest"><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071426;color:#edf9ff}

.dialog h2{margin:0 0 12px;font-size:18px}.dialog p{font-size:12px;color:#c0d9ef;line-height:1.6}.dialog label{display:block;font-size:12px;margin:9px 0 5px}.dialog select,.dialog .wide{width:100%;min-height:40px;border:1px solid #68b9e2;border-radius:10px;background:#14466e;color:white;padding:8px;font-weight:750}
.dialog .wide{margin-top:9px}.promotion{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.promotion button{min-height:62px;border:1px solid #8dcfe8;border-radius:10px;background:#185381;color:white;font-size:42px}
@media(max-width:360px){.shell{padding:4px}.hero{padding:6px 8px;margin-bottom:5px}.board-card{padding:4px}.board-grid{grid-template-columns:14px 1fr}.piece{font-size:clamp(27px,8vw,44px)}.controls{padding:7px;margin-top:5px;gap:5px}.buttons button{min-height:35px}}

<script id="game-dialog-controller">
(function(){
 'use strict';
 let current=null;
 function mount(){
  let el=document.getElementById('gameDialogCover');
  if(el)return el;
  el=document.createElement('div');el.id='gameDialogCover';el.className='game-dialog-cover';el.hidden=true;
  el.setAttribute('role','presentation');
  const root=document.querySelector('main.app')||document.querySelector('.app-shell')&&document.body||document.body;
  root.appendChild(el);
  return el;
 }
 function open(title,message,choices,opts){
  if(current)return Promise.resolve(null);
  const layer=mount();layer.replaceChildren();layer.hidden=false;
  const box=document.createElement('section');box.className='game-dialog-box';
  box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');box.setAttribute('aria-label',title);
  const heading=document.createElement('h2');heading.textContent=title;box.appendChild(heading);
  const paragraph=document.createElement('p');paragraph.textContent=message;box.appendChild(paragraph);
  const zone=document.createElement('div');zone.className=opts&&opts.grid?'game-dialog-choices':'game-dialog-actions';
  box.appendChild(zone);layer.appendChild(box);
  let resolvePromise;
  const promise=new Promise(resolve=>{resolvePromise=resolve;});
  const close=value=>{
   if(!current)return;
   document.removeEventListener('keydown',keyHandler,true);layer.hidden=true;layer.replaceChildren();
   current=null;resolvePromise(value);
  };
  const keyHandler=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close(null);}};
  current={close};document.addEventListener('keydown',keyHandler,true);
  if(opts&&opts.input){
   const input=document.createElement('input');input.className='game-dialog-copy';input.readOnly=true;input.value=opts.input;input.setAttribute('aria-label','Σύνδεσμος πρόσκλησης');box.insertBefore(input,zone);
   input.addEventListener('focus',()=>input.select());
  }
  for(const option of choices){
   const button=document.createElement('button');button.type='button';
   button.className=opts&&opts.grid?'':'game-dialog-btn'+(option.primary?' primary':'');
   button.textContent=option.label;button.addEventListener('click',()=>close(option.value));
   zone.appendChild(button);
  }
  const first=zone.querySelector('button');if(first)first.focus();
  return promise;
 }
 const confirm=message=>open('Επιβεβαίωση',message,[{label:'Ακύρωση',value:false},{label:'Συνέχεια',value:true,primary:true}]).then(x=>x===true);
 const wish=()=>open('🀄 Ευχή Mahjong','Ποιο φύλλο ζητάς από τους επόμενους παίκτες;',[...Array(13)].map((_,i)=>{const n=i+2;return{label:n===11?'J':n===12?'Q':n===13?'K':n===14?'A':String(n),value:n};}).concat([{label:'Ακύρωση',value:null}]),{grid:true});
 const copy=url=>open('🔗 Πρόσκληση φίλου','Αντέγραψε τον σύνδεσμο και στείλε τον φίλο σου.',[{label:'Κλείσιμο',value:true,primary:true}],{input:url});
 window.GameDialog=Object.freeze({confirm,wish,copy});
})();
</script>

<div class="overlay" id="promotion" hidden><div class="dialog" role="dialog" aria-modal="true"><h2>Προαγωγή πιονιού</h2><div id="promotionButtons" class="promotion"></div></div></div>
<script src="./engine.js?v=1"></script>
<script>
(function(){
'use strict';
const E=window.ChessEngine,$=id=>document.getElementById(id),KEY='chessfunny:game:v1',SKEY='chessfunny:score:v1',DKEY='chessfunny:difficulty:v1';
const symbols={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
const pieceNames={K:'βασιλιάς',Q:'βασίλισσα',R:'πύργος',B:'αξιωματικός',N:'ίππος',P:'πιόνι'};
let game=E.start(),history=[],positions=[],last=null,selected=-1,targets=[],hintFrom=-1,thinking=false,finished=false,notice='',difficulty=2,aiTimer=null,score={w:0,b:0,draw:0};
function sig(g){return g.b.map(x=>x||'.').join('')+g.turn+g.castle+g.ep;}
function save(){try{localStorage.setItem(KEY,JSON.stringify({game,history,positions,last,finished}));}catch(e){}}
function saveScore(){try{localStorage.setItem(SKEY,JSON.stringify(score));}catch(e){}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x?.game?.b?.length===64&&['w','b'].includes(x.game.turn)){game=x.game;history=x.history||[];positions=x.positions||[sig(game)];last=x.last;finished=!!x.finished;}}catch(e){}
try{let x=JSON.parse(localStorage.getItem(SKEY)||'null');if(x&&Number.isFinite(x.w)&&Number.isFinite(x.b))score={w:x.w,b:x.b,draw:x.draw||0};}catch(e){}
try{let x=Number(localStorage.getItem(DKEY));if([1,2,3].includes(x))difficulty=x;}catch(e){}$('difficulty').value=String(difficulty);}
function state(){let st=E.status(game);if(!st.over&&positions.filter(x=>x===sig(game)).length>=3)st={over:true,reason:'repetition',winner:null};if(st.over&&!finished){finished=true;if(st.winner==='w')score.w++;else if(st.winner==='b')score.b++;else score.draw++;saveScore();}return st;}
function draw(){
const st=state(),legal=!st.over?E.legal(game):[],king=st.check?game.b.indexOf(game.turn==='w'?'K':'k'):-1;
$('board').replaceChildren();
for(let i=0;i<64;i++){const p=game.b[i],el=document.createElement('button');el.type='button';el.className='sq '+((Math.floor(i/8)+i%8)%2?'dark':'light');el.setAttribute('role','gridcell');el.setAttribute('aria-label',E.name(i)+' '+(p?(E.side(p)==='w'?'λευκό ':'μαύρο ')+pieceNames[p.toUpperCase()]:'κενό'));
if(last&&(last.from===i||last.to===i))el.classList.add('last');if(selected===i)el.classList.add('selected');if(hintFrom===i)el.classList.add('hint');if(i===king)el.classList.add('check');if(targets.some(m=>m.to===i))el.classList.add(p?'capture':'target');
if(p){let a=document.createElement('span');a.className='piece '+(E.side(p)==='w'?'white':'black');a.textContent=symbols[p];a.setAttribute('aria-hidden','true');el.appendChild(a);}el.addEventListener('click',()=>tap(i));$('board').appendChild(el);}
$('status').textContent=st.over?(st.reason==='mate'?(st.winner==='w'?'🏆 Ματ! Κέρδισες.':'Ματ! Κέρδισε ο υπολογιστής.'):'Ισοπαλία · '+({stalemate:'πατ',fifty:'50 κινήσεις',insufficient:'ανεπαρκές υλικό',repetition:'επανάληψη'}[st.reason]||'')):thinking?'Ο υπολογιστής σκέφτεται…':notice||(st.check?'⚠ Σαχ!':game.turn==='w'?'Επίλεξε λευκό κομμάτι.':'Περιμένουμε τον υπολογιστή.');
$('turn').textContent=st.over?'Τέλος παρτίδας':game.turn==='w'&&!thinking?'♙ Η σειρά σου':'♚ Σειρά AI';$('wins').textContent='🏆 Νίκες '+score.w+'–'+score.b+(score.draw?' · Ισ. '+score.draw:'');$('aiLevel').textContent='AI · '+({1:'Εύκολο',2:'Κανονικό',3:'Δύσκολο'}[difficulty]);
$('hint').disabled=st.over||game.turn!=='w'||thinking;$('undo').disabled=!history.length;save();}
function move(m){history.push({game:JSON.parse(JSON.stringify(game)),positions:positions.slice(),last});if(history.length>100)history.shift();game=E.make(game,m);positions.push(sig(game));last={from:m.from,to:m.to};selected=-1;targets=[];hintFrom=-1;notice='';draw();if(!finished&&game.turn==='b')scheduleAI();}
function tap(i){if(finished||thinking||game.turn!=='w')return;hintFrom=-1;const moves=targets.filter(m=>m.to===i);if(selected>=0&&moves.length){if(moves.some(m=>m.promo)){promote(moves);return;}move(moves[0]);return;}
if(game.b[i]&&E.side(game.b[i])==='w'){selected=i;targets=E.legal(game).filter(m=>m.from===i);notice=targets.length?'Επίλεξε φωτισμένη θέση.':'Αυτό το κομμάτι δεν μπορεί να κινηθεί.';}else{selected=-1;targets=[];notice='';}draw();}
function promote(moves){$('promotionButtons').replaceChildren();$('promotion').hidden=false;for(const m of moves){const b=document.createElement('button');b.textContent=symbols[m.promo.toUpperCase()];b.setAttribute('aria-label','Προαγωγή σε '+pieceNames[m.promo.toUpperCase()]);b.addEventListener('click',()=>{$('promotion').hidden=true;move(m);});$('promotionButtons').appendChild(b);}}
function scheduleAI(){if(aiTimer!==null)clearTimeout(aiTimer);thinking=true;draw();aiTimer=setTimeout(()=>{aiTimer=null;if(finished||game.turn!=='b'){thinking=false;draw();return;}try{const m=E.ai(game,difficulty);thinking=false;if(m)move(m);else draw();}catch(err){thinking=false;notice='Σφάλμα AI, χρησιμοποίησε Αναίρεση.';draw();console.error(err);}},350);}
function undo(){if(aiTimer!==null)clearTimeout(aiTimer);aiTimer=null;thinking=false;if(!history.length)return;if(finished){const result=E.status(game),winner=result.winner;if(winner==='w'&&score.w>0)score.w--;else if(winner==='b'&&score.b>0)score.b--;else if(!winner&&score.draw>0)score.draw--;saveScore();}let x=history.pop();while(x.game.turn!=='w'&&history.length)x=history.pop();game=x.game;positions=x.positions;last=x.last;finished=false;selected=-1;targets=[];hintFrom=-1;notice='Αναιρέθηκε η κίνηση.';draw();if(game.turn==='b')scheduleAI();}
function hint(){if(finished||thinking||game.turn!=='w')return;const m=E.ai(game,2);if(!m)return;selected=m.from;hintFrom=m.from;targets=E.legal(game).filter(x=>x.from===m.from);notice='💡 '+E.name(m.from)+' → '+E.name(m.to);draw();}
function reset(){if(aiTimer!==null)clearTimeout(aiTimer);aiTimer=null;game=E.start();positions=[sig(game)];history=[];last=null;selected=-1;targets=[];hintFrom=-1;notice='';thinking=false;finished=false;draw();}
function settings(show){$('settings').hidden=!show;$('gear').setAttribute('aria-expanded',String(show));if(show)$('closeSettings').focus();else $('gear').focus();}
$('gear').addEventListener('click',()=>settings(true));$('closeSettings').addEventListener('click',()=>settings(false));$('settings').addEventListener('click',e=>{if(e.target===$('settings'))settings(false);});
$('difficulty').addEventListener('change',e=>{difficulty=Number(e.target.value);try{localStorage.setItem(DKEY,String(difficulty));}catch(_){}draw();});
$('clearWins').addEventListener('click',async()=>{if(await GameDialog.confirm('Να μηδενιστούν οι νίκες;')){score={w:0,b:0,draw:0};saveScore();draw();}});
$('undo').addEventListener('click',()=>{undo();settings(false)});$('hint').addEventListener('click',()=>{hint();settings(false)});$('new').addEventListener('click',async()=>{if(!history.length||finished||await GameDialog.confirm('Να ξεκινήσει νέα παρτίδα;')){reset();settings(false);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')settings(false);});
load();positions.length||(positions=[sig(game)]);draw();if(!finished&&game.turn==='b')scheduleAI();
})();
</script>
<!-- Ενιαίος οδηγός παιχνιδιού μέσα στις ρυθμίσεις -->
<script>
(()=>{
const rules=["Στόχος: κάνε ματ στον αντίπαλο βασιλιά. Ο βασιλιάς δεν επιτρέπεται να μείνει σε σαχ.","Ο πύργος κινείται οριζόντια ή κάθετα, ο αξιωματικός διαγώνια και η βασίλισσα και με τους δύο τρόπους.","Το άλογο κινείται σε σχήμα Γ και μπορεί να πηδά πάνω από κομμάτια. Ο βασιλιάς κινείται ένα τετράγωνο.","Το πιόνι προχωρά μπροστά ένα τετράγωνο (δύο στην πρώτη του κίνηση) και αιχμαλωτίζει διαγώνια. Στην τελευταία γραμμή προάγεται.","Ειδικές κινήσεις: ροκέ, αν παίκτης και πύργος πληρούν τις προϋποθέσεις, και en passant στην κατάλληλη αμέσως επόμενη κίνηση.","Ισοπαλία μπορεί να προκύψει από πατ, επανάληψη θέσης ή άλλους κανόνες."];
const style=document.createElement('style');style.textContent=`.funny-help-overlay{position:fixed;inset:0;z-index:2147483640;background:#020b19dc;display:flex;align-items:center;justify-content:center;padding:16px}.funny-help-overlay[hidden]{display:none!important}.funny-help-card{width:min(460px,100%);max-height:85dvh;overflow:auto;background:linear-gradient(155deg,#15395b,#091a30);color:#edf8ff;border:1px solid #68b9ed;border-radius:18px;padding:20px;box-shadow:0 15px 50px #0009;font:14px/1.55 system-ui,sans-serif}.funny-help-card h2{font-size:20px;margin:0 0 12px;text-align:center}.funny-help-card ol{padding-left:24px}.funny-help-card li{margin-bottom:10px}.funny-help-btn{background:#17486d;color:#e8f7ff;border:1px solid #67b9e6;border-radius:10px;padding:9px 12px;cursor:pointer;font:600 13px system-ui,sans-serif}.funny-help-close{display:block;width:100%;margin-top:12px}.funny-help-gear{position:absolute;right:12px;top:12px;font-size:22px}.funny-help-host{position:relative}`;document.head.append(style);
const overlay=document.createElement('div');overlay.className='funny-help-overlay';overlay.hidden=true;overlay.setAttribute('role','presentation');const card=document.createElement('section');card.className='funny-help-card';card.setAttribute('role','dialog');card.setAttribute('aria-modal','true');card.setAttribute('aria-label','Πώς παίζεται');const title=document.createElement('h2');title.textContent='📖 Πώς παίζεται';const list=document.createElement('ol');for(const rule of rules){const li=document.createElement('li');li.textContent=rule;list.append(li)}const close=document.createElement('button');close.type='button';close.className='funny-help-btn funny-help-close';close.textContent='Επιστροφή στο παιχνίδι';card.append(title,list,close);overlay.append(card);document.body.append(overlay);let previous=null;function hide(){overlay.hidden=true;const target=previous;if(target?.isConnected&&target.getClientRects().length)target.focus();else document.querySelector('#settingsButton,#gear,.funny-help-gear')?.focus()}function show(){previous=document.activeElement;const settings=document.getElementById('settingsDialog');if(settings?.open)settings.close();const chess=document.getElementById('settings');if(chess)chess.hidden=true;overlay.hidden=false;close.focus()}close.addEventListener('click',hide);overlay.addEventListener('click',e=>{if(e.target===overlay)hide()});document.addEventListener('keydown',e=>{if(!overlay.hidden&&e.key==='Escape'){e.stopPropagation();hide()}});
const settings=document.getElementById('settingsDialog')||document.getElementById('settings');const btn=document.createElement('button');btn.type='button';btn.className='funny-help-btn';btn.textContent='📖 Πώς παίζεται';btn.addEventListener('click',show);if(settings){const form=settings.querySelector('form')||settings.querySelector('.dialog')||settings;const last=form.querySelector('button:last-of-type');if(last)last.before(btn);else form.append(btn)}else{const hero=document.querySelector('.hero')||document.querySelector('header')||document.body;hero.classList.add('funny-help-host');const gear=document.createElement('button');gear.type='button';gear.className='funny-help-btn funny-help-gear';gear.textContent='⚙';gear.setAttribute('aria-label','Ρυθμίσεις και οδηγίες');gear.addEventListener('click',show);hero.append(gear)}
})();
</script>
