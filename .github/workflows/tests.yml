name: Games browser smoke tests
on:
  push:
    branches: [main]
    paths:
      - '**/game.js'
      - '**/index.html'
      - 'shared/**'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check shared/core.js
          for f in */game.js; do node --check "$f"; done
          node --check sw.js
          node --check tests/smoke.cjs
      - name: Install browser automation
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Run desktop and mobile gameplay smoke checks
        run: node tests/smoke.cjs
