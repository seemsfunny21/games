name: Games browser smoke tests
on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.html'
      - '**/*.css'
      - '**/*.svg'
      - '**/*.webmanifest'
      - '**/*.cjs'
      - '.github/workflows/tests.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * 1'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
          find tests -name '*.cjs' -print0 | xargs -0 -n1 node --check
      - name: Install browser automation
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Run desktop and mobile gameplay smoke checks
        run: node tests/smoke.cjs
      - name: Check other ten games on mobile and desktop including offline
        run: node tests/migrated.cjs
      - name: Audit unique 20-level layouts across all difficulties
        run: node tests/levels.cjs
      - name: Actually complete 600 stages through legal game UI actions
        run: node tests/stage-playthrough.cjs
      - name: Verify Water Sort difficulty with independent optimal puzzle solver
        run: node tests/water-difficulty.cjs
      - name: Check Sudoku, Reversi and Quiz engines
        run: node tests/legacy-engines.cjs
      - name: Check Solitaire manual/automatic foundation behavior
        run: node tests/solitaire-auto-foundation.cjs
