<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09182a"><title>My Virtual Pet 3D · Παπαγαλάκι</title><link rel="stylesheet" href="./style.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head>
<body><main id="app"><div id="scene" aria-label="Τρισδιάστατο δωμάτιο με παπαγαλάκι"></div><header class="top"><div><a href="../" class="back">‹ Games</a><h1>🦜 My Virtual Pet <span>3D</span></h1><p id="subtitle">Ο μικρός σου φίλος σε περιμένει</p></div><button id="settings" aria-label="Ρυθμίσεις">⚙</button></header>
<div class="pet-info" aria-label="Στοιχεία κατοικιδίου"><strong id="petName">Παπαγαλάκι</strong><span id="age">Ημέρα 1</span><span id="status" role="status"></span></div>
<section class="actions" aria-label="Φροντίδα"><button data-action="feed" data-need="food"><span class="need-value" data-meter="food">--%</span>🌻<span>Τροφή</span></button><button data-action="water" data-need="water"><span class="need-value" data-meter="water">--%</span>💧<span>Νερό</span></button><button data-action="play" data-need="happy"><span class="need-value" data-meter="happy">--%</span>🪀<span>Παιχνίδι</span></button><button data-action="pet" data-need="happy"><span class="need-value" data-meter="happy">--%</span>💚<span>Χάδι</span></button><button data-action="sleep" data-need="energy"><span class="need-value" data-meter="energy">--%</span>🌙<span>Ύπνος</span></button></section><div class="health-pill" aria-label="Υγεία και καθαριότητα κατοικιδίου">✨ <span data-meter="clean">--%</span> · ❤️ <span data-meter="health">--%</span></div>
<div class="zoom-controls" aria-label="Μεγέθυνση κάμερας"><button id="zoomOut" aria-label="Πιο μακριά">−</button><button id="zoomIn" aria-label="Πιο κοντά">+</button></div><div class="hint">Σύρε για περιστροφή · Ροδέλα ή δύο δάχτυλα για zoom</div><div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal" hidden><div class="dialog"><h2 id="modalTitle"></h2><div id="modalBody"></div><div id="modalButtons"></div></div></div>
</main><script type="module" src="./game.js"></script></body></html>
