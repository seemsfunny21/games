<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Legends of Aetheria — Κεφάλαιο I</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101e;color:#e8e6d5;font-family:system-ui,Arial}#game{display:block;width:100vw;height:100vh;image-rendering:pixelated;cursor:crosshair}#hud{position:fixed;top:12px;left:14px;background:#071426dc;border:1px solid #416c8a;border-radius:12px;padding:10px 14px;pointer-events:none;min-width:225px}#hud small{color:#a8c9d8}#quest{position:fixed;top:12px;right:14px;max-width:340px;background:#071426e6;border:1px solid #416c8a;border-radius:12px;padding:12px;font-size:13px;pointer-events:none}#controls{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#071426d9;padding:8px 15px;border-radius:10px;font-size:12px;white-space:nowrap}#overlay{position:fixed;inset:0;background:#020814db;display:grid;place-items:center}#panel{max-width:580px;width:90%;max-height:90vh;overflow:auto;background:linear-gradient(145deg,#112d47,#071425);border:2px solid #538bb2;border-radius:20px;padding:25px;text-align:center;box-shadow:0 20px 70px #000}h1{font-family:Georgia,serif;color:#ffdc88;margin:8px 0}p{line-height:1.55}button,select{background:#163f5f;color:white;border:1px solid #6aa3c7;padding:11px 17px;margin:5px;border-radius:9px;cursor:pointer;font:inherit}button:hover{background:#28638a}#toast{position:fixed;bottom:54px;left:50%;transform:translateX(-50%);background:#0c2539ee;border:1px solid #9bceec;border-radius:9px;padding:10px 18px;display:none;text-align:center;max-width:80vw}#bars{font-weight:700}#bars span{color:#ffb9a7}#maplabel{color:#ffdc88}#panel .small{font-size:12px;color:#b6c9d7}
</style></head><body><canvas id="game"></canvas><div id="hud"><strong>⚔ Kael</strong> <span id="level"></span><div id="bars"></div><small id="stats"></small><div id="maplabel"></div></div><div id="quest"></div><div id="toast"></div><div id="controls">WASD / Βέλη: κίνηση · Κλικ / J: επίθεση · Space: αποφυγή · E: ομιλία · H: φίλτρο · I: τσάντα · Esc: μενού</div><div id="overlay"><div id="panel"></div></div>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel');
const TILE=40,W=62,H=38, SAVE='aetheria-ch1-v1',keys=new Set();
let game,actors=[],npcs=[],items=[],decor=[],walls=new Set(),mode='menu',camera={x:0,y:0},last=0,toastUntil=0,attackUntil=0,invulnerable=0,enemyTimer=0,autosaveTimer=0,mouse={x:0,y:0},boss=null;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),tileKey=(x,y)=>x+','+y;
const zones=[{name:'Αλθέα — Κοιλάδα της Αυγής',x:0,y:0,w:25,h:20},{name:'Δάσος του Παλαιού Μονοπατιού',x:25,y:0,w:22,h:29},{name:'Αρχαίος Ναός',x:47,y:0,w:15,h:29}];
const quests=['Μίλησε στον γέροντα Θέροντα στο χωριό.','Βρες τη Λύρα και πάρε το θεραπευτικό φίλτρο.','Νίκησε 3 διεφθαρμένους λύκους στο δάσος.','Βρες το αρχαίο κλειδί στο δάσος.','Άνοιξε την πύλη του ναού και νίκησε τον Φύλακα της Πέτρας.','Επέστρεψε στον Θέροντα για την αποκάλυψη.','Κεφάλαιο I ολοκληρώθηκε!'];
function startState(){return {x:9*TILE,y:11*TILE,hp:100,maxHp:100,level:1,xp:0,gold:12,potions:2,quest:0,kills:0,key:false,gate:false,bossDead:false,difficulty:'normal',dir:0,playtime:0,completed:false};}
function block(x,y){walls.add(tileKey(x,y))}
function rect(x,y,w,h){for(let i=x;i<x+w;i++)for(let j=y;j<y+h;j++)block(i,j)}
function buildWorld(){
 walls.clear();actors=[];npcs=[];items=[];decor=[];
 for(let x=0;x<W;x++){block(x,0);block(x,H-1)}for(let y=0;y<H;y++){block(0,y);block(W-1,y)}
 for(let y=0;y<H;y++)if(y<9||y>14)block(24,y);
 for(let y=0;y<H;y++)if(y<11||y>15)block(46,y);
 // River crossing
 for(let x=0;x<24;x++)for(let y=23;y<26;y++)block(x,y);
 for(let x=10;x<14;x++)for(let y=23;y<26;y++)walls.delete(tileKey(x,y));
 // Houses with doors and a clear central square
 [[4,4,5,4],[13,4,5,4],[4,14,5,4],[14,15,5,4]].forEach(([x,y,w,h])=>rect(x,y,w,h));
 for(let i=0;i<125;i++){let x=(i*37+11)%W,y=(i*23+7)%H;if(x<24&&y>19||x>=25&&x<46&&y>4){if(!walls.has(tileKey(x,y))&&!(x>24&&x<47&&y>=10&&y<=16)){if(i%3===0)block(x,y);else decor.push({x,y,type:i%2})}}}
 // Temple walls, entry and boss arena
 rect(48,5,13,1);rect(48,5,1,18);rect(60,5,1,18);rect(48,22,13,1);
 for(let x=48;x<61;x++)walls.delete(tileKey(x,13)); // accessible passage from west
 for(let y=11;y<16;y++)walls.delete(tileKey(48,y));
 for(let x=49;x<60;x++)for(let y=6;y<22;y++)walls.delete(tileKey(x,y));
 npcs=[{x:11*TILE,y:9*TILE,name:'Θέροντας',color:'#f5d68b',id:'elder'},{x:17*TILE,y:11*TILE,name:'Λύρα',color:'#e6a7ef',id:'healer'},{x:7*TILE,y:20*TILE,name:'Έμπορος',color:'#c8d2ec',id:'merchant'}];
 for(let i=0;i<8;i++){let x=(29+i%4*4)*TILE,y=(7+Math.floor(i/4)*12)*TILE;actors.push({x,y,hp:45,maxHp:45,type:'wolf',alive:true,hit:0,seed:i})}
 items.push({x:42*TILE,y:22*TILE,type:'key',taken:false});
 boss={x:55*TILE,y:12*TILE,hp:340,maxHp:340,type:'boss',alive:true,hit:0,seed:10};actors.push(boss);
}
function solid(x,y){let tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);return walls.has(tileKey(tx,ty))||(!game.gate&&tx===47&&ty>=11&&ty<=15)}
function canMove(x,y,r=12){return !solid(x-r,y-r)&&!solid(x+r,y-r)&&!solid(x-r,y+r)&&!solid(x+r,y+r)}
function move(a,dx,dy){if(canMove(a.x+dx,a.y))a.x+=dx;if(canMove(a.x,a.y+dy))a.y+=dy}
function notify(s,t=3300){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';toastUntil=performance.now()+t}
function save(){if(!game)return;try{localStorage.setItem(SAVE,JSON.stringify({...game,version:1}))}catch(e){notify('Δεν ήταν δυνατή η αποθήκευση στον browser.')}}
function load(){try{let v=JSON.parse(localStorage.getItem(SAVE));if(v&&v.version===1&&Number.isFinite(v.x)&&Number.isFinite(v.y))return v}catch(e){}return null}
function begin(resume){game=resume?load()||startState():startState();buildWorld();if(game.key)items[0].taken=true;if(game.bossDead)boss.alive=false;for(let i=0;i<Math.min(game.kills,8);i++)actors[i].alive=false;mode='play';overlay.style.display='none';notify('Κεφάλαιο I — Η Σπασμένη Σφραγίδα');save()}
function menu(title,body,buttons){mode='menu';overlay.style.display='grid';panel.innerHTML='<h1>'+title+'</h1><p>'+body+'</p>';buttons.forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=fn;panel.appendChild(b)})}
function mainMenu(){const has=!!load();menu('LEGENDS OF AETHERIA','Οι Πέντε Σφραγίδες<br>Κεφάλαιο I: Η Σπασμένη Σφραγίδα<br><span class="small">Πρώτη παικτική έκδοση · αποκλειστικά για υπολογιστή</span>',[...(has?[['Συνέχεια',()=>begin(true)]]:[]),['Νέο παιχνίδι',()=>{if(has&&!confirm('Να αντικατασταθεί η προηγούμενη πρόοδος;'))return;begin(false)}]])}
function pause(){if(mode!=='play')return;save();menu('Παύση','Η πρόοδος αποθηκεύτηκε.',[['Συνέχεια',()=>{mode='play';overlay.style.display='none'}],['Δυσκολία: '+({easy:'Εύκολη',normal:'Κανονική',hard:'Δύσκολη'}[game.difficulty]),()=>{game.difficulty={easy:'normal',normal:'hard',hard:'easy'}[game.difficulty];save();pauseAgain()}],['Τσάντα',inventory],['Κεντρικό μενού',mainMenu]])}
function pauseAgain(){mode='play';overlay.style.display='none';pause()}
function inventory(){if(!game)return;save();menu('Τσάντα','🧪 Φίλτρα: '+game.potions+'<br>🪙 Χρυσός: '+game.gold+'<br>🗝 Αρχαίο κλειδί: '+(game.key?'Ναι':'Όχι')+'<br>⚔ Σπαθί ταξιδιώτη<br>Εμπειρία: '+game.xp+' / '+(game.level*70),[['Χρήση φίλτρου (H)',()=>{heal();inventory()}],['Επιστροφή',()=>{mode='play';overlay.style.display='none'}]])}
function heal(){if(game.potions<1){notify('Δεν έχεις φίλτρα.');return}if(game.hp>=game.maxHp){notify('Η ζωή είναι ήδη γεμάτη.');return}game.potions--;game.hp=Math.min(game.maxHp,game.hp+55);notify('Ανακτήθηκαν έως 55 HP');save()}
function talk(){let n=npcs.find(n=>dist(n,game)<85);if(!n){notify('Πλησίασε έναν χαρακτήρα για να μιλήσεις.');return}
 if(n.id==='elder'){if(game.quest===0){game.quest=1;notify('Θέροντας: Βρες τη Λύρα. Κάτι σκοτεινό κινείται στο δάσος.',5000)}
 else if(game.quest===5){game.quest=6;game.completed=true;notify('Θέροντας: Είσαι ο τελευταίος από τους Φύλακες. Το Δάσος των Ψιθύρων σε περιμένει!',6500)}
 else notify('Θέροντας: Η μοίρα της Aetheria βρίσκεται στα χέρια σου.',4500)}
 if(n.id==='healer'){if(game.quest===1){game.potions++;game.quest=2;notify('Λύρα: Πάρε ένα φίλτρο. Πρόσεχε τους λύκους στο δάσος.',4500)}else notify('Λύρα: Μπορείς να χρησιμοποιήσεις φίλτρο με H.')}
 if(n.id==='merchant'){if(game.gold>=8){game.gold-=8;game.potions++;notify('Έμπορος: Αγόρασες φίλτρο για 8 χρυσά.')}else notify('Έμπορος: Χρειάζεσαι 8 χρυσά για φίλτρο.')}
 save()}
function attack(){if(mode!=='play'||performance.now()<attackUntil)return;attackUntil=performance.now()+340;let angle=game.dir;let dmg=game.difficulty==='hard'?23:30;for(let a of actors){if(!a.alive||dist(a,game)>80)continue;let dir=Math.atan2(a.y-game.y,a.x-game.x);if(Math.cos(dir-angle)<0.25)continue;a.hp-=dmg;a.hit=performance.now()+160;if(a.hp<=0){a.alive=false;game.xp+=a.type==='boss'?130:20;game.gold+=a.type==='boss'?35:3;if(a.type==='wolf'){game.kills++;if(game.quest===2&&game.kills>=3){game.quest=3;notify('Αποστολή ολοκληρώθηκε! Βρες το αρχαίο κλειδί.')}}if(a.type==='boss'){game.bossDead=true;game.quest=5;notify('Ο Φύλακας της Πέτρας νικήθηκε! Επέστρεψε στον Θέροντα.',5000)}while(game.xp>=game.level*70){game.xp-=game.level*70;game.level++;game.maxHp+=15;game.hp=game.maxHp;notify('Νέο επίπεδο! '+game.level)}save()}}}
function action(){if(mode!=='play')return;talk()}
function update(dt,t){if(mode!=='play')return;game.playtime+=dt;let dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);let len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;if(dx||dy){game.dir=Math.atan2(dy,dx);move(game,dx*180*dt,dy*180*dt)}
 for(let a of actors){if(!a.alive)continue;let d=dist(a,game);if(a.type==='boss'&&!game.gate)continue;if(d<300&&d>33){let speed=a.type==='boss'?72:86;move(a,(game.x-a.x)/d*speed*dt,(game.y-a.y)/d*speed*dt)}if(d<35&&t>enemyTimer&&t>invulnerable){let damage=a.type==='boss'?22:10;if(game.difficulty==='easy')damage=Math.ceil(damage*.65);if(game.difficulty==='hard')damage=Math.ceil(damage*1.5);game.hp-=damage;invulnerable=t+900;enemyTimer=t+900;if(game.hp<=0){game.hp=game.maxHp;game.x=9*TILE;game.y=11*TILE;game.gold=Math.max(0,game.gold-5);notify('Έπεσες στη μάχη. Επέστρεψες στην Αλθέα.',4500);save()}}}
 if(game.quest===3&&!items[0].taken&&dist(game,items[0])<45){items[0].taken=true;game.key=true;game.quest=4;notify('Βρήκες το Αρχαίο Κλειδί! Η πύλη του ναού σε περιμένει.');save()}
 if(game.quest===4&&game.key&&!game.gate&&game.x>45*TILE&&game.y>10*TILE&&game.y<16*TILE){game.gate=true;notify('Η αρχαία πύλη άνοιξε.');save()}
 autosaveTimer+=dt;if(autosaveTimer>20){autosaveTimer=0;save()}
}
function draw(t){const w=canvas.width=window.innerWidth,h=canvas.height=window.innerHeight;ctx.imageSmoothingEnabled=false;ctx.fillStyle='#132b25';ctx.fillRect(0,0,w,h);if(!game)return;
 camera.x=clamp(game.x-w/2,0,Math.max(0,W*TILE-w));camera.y=clamp(game.y-h/2,0,Math.max(0,H*TILE-h));ctx.save();ctx.translate(-camera.x,-camera.y);
 let minX=Math.max(0,Math.floor(camera.x/TILE)),maxX=Math.min(W,Math.ceil((camera.x+w)/TILE)),minY=Math.max(0,Math.floor(camera.y/TILE)),maxY=Math.min(H,Math.ceil((camera.y+h)/TILE));
 for(let y=minY;y<maxY;y++)for(let x=minX;x<maxX;x++){let c=x<25?'#426c44':x<47?'#254c38':'#4c4c56';let r=(x*73+y*131)%7;ctx.fillStyle=r<2?shade(c,12):c;ctx.fillRect(x*TILE,y*TILE,TILE,TILE);if(x<25&&y>=23&&y<26){ctx.fillStyle='#28749b';ctx.fillRect(x*TILE,y*TILE,TILE,TILE)}if(walls.has(tileKey(x,y))){ctx.fillStyle=x<25?'#2d4934':x<47?'#17352b':'#777480';ctx.fillRect(x*TILE+2,y*TILE+2,TILE-4,TILE-4);ctx.fillStyle='#a4b1a1';ctx.fillRect(x*TILE+5,y*TILE+5,TILE-10,5)}}
 // bridge
 ctx.fillStyle='#a77b46';ctx.fillRect(10*TILE,23*TILE,4*TILE,3*TILE);
 if(!game.gate){ctx.fillStyle='#b07b37';ctx.fillRect(47*TILE,11*TILE,20,5*TILE)}
 for(let d of decor){ctx.fillStyle=d.type?'#56884b':'#75a35a';ctx.beginPath();ctx.arc(d.x*TILE+20,d.y*TILE+20,8,0,7);ctx.fill()}
 for(let item of items)if(!item.taken){ctx.fillStyle='#ffdd67';ctx.fillRect(item.x-10,item.y-10,20,20);ctx.fillStyle='#fff';ctx.fillText('✦',item.x-5,item.y+4)}
 for(let n of npcs){drawPerson(n.x,n.y,n.color);label(n.name,n.x,n.y-27)}
 for(let a of actors)if(a.alive){ctx.fillStyle=a.hit>t?'#fff':a.type==='boss'?'#aa587c':'#a95549';ctx.beginPath();ctx.arc(a.x,a.y,a.type==='boss'?27:16,0,7);ctx.fill();ctx.fillStyle='#ffdcaf';ctx.fillRect(a.x-8,a.y-5,5,4);ctx.fillRect(a.x+4,a.y-5,5,4);ctx.fillStyle='#12171c';ctx.fillRect(a.x-24,a.y-33,48,5);ctx.fillStyle='#db5a5a';ctx.fillRect(a.x-24,a.y-33,48*Math.max(0,a.hp/a.maxHp),5);if(a.type==='boss')label('Φύλακας της Πέτρας',a.x,a.y-45)}
 drawPerson(game.x,game.y,t<invulnerable&&Math.floor(t/100)%2?'#ffffff':'#56b5d8');ctx.strokeStyle='#ffe9b0';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(game.x,game.y);ctx.lineTo(game.x+Math.cos(game.dir)*24,game.y+Math.sin(game.dir)*24);ctx.stroke();if(t<attackUntil){ctx.strokeStyle='#ffe28c';ctx.lineWidth=6;ctx.beginPath();ctx.arc(game.x,game.y,52,game.dir-.6,game.dir+.6);ctx.stroke()}
 ctx.restore();
 const zone=zones.find(z=>game.x/TILE>=z.x&&game.x/TILE<z.x+z.w)||zones[0];document.getElementById('maplabel').textContent=zone.name;document.getElementById('level').textContent='Επίπεδο '+game.level;document.getElementById('bars').innerHTML='<span>♥ '+Math.max(0,game.hp)+' / '+game.maxHp+'</span> · ✦ '+game.xp+'/'+(game.level*70);document.getElementById('stats').textContent='🧪 '+game.potions+'   🪙 '+game.gold+'   🐺 '+game.kills;document.getElementById('quest').innerHTML='<b>📜 Κεφάλαιο I</b><div style="margin-top:6px">'+quests[game.quest]+'</div>';
 if(t>toastUntil)document.getElementById('toast').style.display='none';
}
function shade(hex,n){let k=parseInt(hex.slice(1),16),r=clamp((k>>16)+n,0,255),g=clamp(((k>>8)&255)+n,0,255),b=clamp((k&255)+n,0,255);return 'rgb('+r+','+g+','+b+')'}
function label(s,x,y){ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#071426';ctx.strokeText(s,x,y);ctx.fillStyle='#fff3c5';ctx.fillText(s,x,y)}
function drawPerson(x,y,color){ctx.fillStyle='#16202a';ctx.beginPath();ctx.ellipse(x,y+15,14,7,0,0,7);ctx.fill();ctx.fillStyle=color;ctx.fillRect(x-12,y-10,24,26);ctx.fillStyle='#e7ba8b';ctx.fillRect(x-9,y-23,18,16);ctx.fillStyle='#2c2a34';ctx.fillRect(x-10,y-26,20,7)}
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();keys.add(k);if(e.repeat)return;if(k==='escape'){if(mode==='play')pause();else if(game){mode='play';overlay.style.display='none'}}else if(mode==='play'){if(k==='j')attack();if(k==='e')action();if(k==='h')heal();if(k==='i')inventory();if(k===' '){let dx=Math.cos(game.dir)*110,dy=Math.sin(game.dir)*110;for(let i=0;i<7;i++)move(game,dx/7,dy/7);invulnerable=performance.now()+450}}});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();if(mode==='play')pause()});canvas.addEventListener('mousedown',e=>{if(e.button!==0)return;game&&(game.dir=Math.atan2(e.clientY-(game.y-camera.y),e.clientX-(game.x-camera.x)));attack()});canvas.addEventListener('contextmenu',e=>e.preventDefault());
function frame(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt,t);draw(t);requestAnimationFrame(frame)}mainMenu();requestAnimationFrame(frame);
</script></body></html>
